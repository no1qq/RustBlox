[package]
name = "rustblox"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A modern desktop client and launcher for Roblox"
authors = ["Julian"]
license = "MIT"
repository = "https://github.com/no1qq/RustBlox"
build = "build.rs"

[[bin]]
name = "RustBlox"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.36", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
rfd = { version = "0.17", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ureq = { version = "3.2.1", default-features = false, features = ["rustls", "gzip"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
md-5 = "0.11"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_Memory",
    "Win32_System_Pipes",
] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
zip = { version = "8", features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
